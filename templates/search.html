<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="light-theme">
    <header>
        <h1>Search Results</h1>
    </header>

    <main>
        {% if videos %}
            <div class="video-list">
                {% for video in videos %}
                    <div class="video-item">
                        <img src="{{ video.thumbnail }}" alt="{{ video.title }}">
                        <h2>{{ video.title }}</h2>
                        <a href="{{ video.url }}">Watch Video</a>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p>No videos found for your query.</p>
            <button class="go-back" onclick="window.history.back()">Go Back</button>
        {% endif %}
    </main>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
